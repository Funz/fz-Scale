name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}

    - name: Install fz and pytest
      run: pip install git+https://github.com/Funz/fz.git pytest

    - name: Check shell scripts
      if: runner.os != 'Windows'
      run: |
        for f in .fz/calculators/*.sh tests/fake/scalerte tests/scale_probe/run_probe.sh; do
          bash -n "$f"
          [ -x "$f" ] || { echo "$f is not executable"; exit 1; }
        done

    # No SCALE on the runners: tests/test_scale_real.py is skipped; the
    # calculator tests (bash) are skipped on Windows.
    - name: Run tests
      run: pytest tests/ -v
